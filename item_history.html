// init theme colors
let themeColors = d3.schemeTableau10;
function setTheme(){
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        // themeColors = d3.schemeSet3
        themeColors = d3.schemeTanner10
    } else {
        themeColors = d3.schemeTableau10
    }
    // console.log("themeColors",themeColors)
};
setTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
    setTheme()
});

const margin = { top: 20, right: 30, bottom: 30, left: 40 };
const width = +d3.select("svg").attr("width") - margin.left - margin.right;
const height = +d3.select("svg").attr("height") - margin.top - margin.bottom;

const svg = d3.select("svg")
.append("g")
.attr("transform", `translate(${margin.left},${margin.top})`);

const tooltip = d3.select("#tooltip");

let salesData = [];
let uniqueItems = [];
const revLineColor = "#75c058";

function resetTextArea() {
    textArea = document.getElementById('search_area');
    textArea.value = "";
    textArea.placeholder = "Paste whole item ids here...\n\nWorks well with my item search tool...\n\nfind the item search and other tools here:\nggs.tannerr.com";
};

function sanitizeId(id) {
    return id.replace(/[^a-zA-Z0-9_-]/g, '_');
};

function debounce(fn, wait = 300) {
    let t;
    return (...args) => {
        clearTimeout(t);
        t = setTimeout(()=> fn(...args), wait)
    };
};

function parseSearchList(text) {
  return text
    .split(/[\s,]+/)
    .map(s => s.trim().toUpperCase())
    .filter(Boolean);
};

function updateSearchResults() {
    const searchValue = d3.select("#searchInput").property("value").toLowerCase();
    const filteredItems = uniqueItems.filter(item => item.toLowerCase().includes(searchValue));

    const itemList = d3.select("#itemList");
    itemList.selectAll("*").remove(); // Clear existing items

    filteredItems.forEach(item => {
        itemList.append("div")
            .attr("class", "item-list-item")
            .text(item)
            .on("click", () => addItemToList(item)); // Add item to list on click
    });
};

function doSearchAndRender() {
    const raw = document.getElementById('search_area').value;
    // console.log(raw)
    const list = parseSearchList(raw);
    console.log(list)
    addItemsToList(list)
};

function handleClearAll() {
    d3.select("#selectedItems").selectAll("*").remove(); // remove selected items
    d3.select("#selectedCustomers").selectAll("*").remove();
    d3.select("#searchInput").property("value", ""); // clear text area
    updateSearchResults();
    resetTextArea();
    render();
};

function handleFileInput() {
    const file = this.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async function (e) {
        const content = e.target.result;

        // track errors
        const errors = [];
        let rowIndex = 0;

        salesData = d3.csvParse(content, d => {
            //track index for error tracking
            const currentIndex = rowIndex++;

            // fields we need to check for missing data, columns needed..
            const dateStr = d.order_date;
            const customer = d.customer_name;
            const item_id = d.item_id;
            const qty = Number(d.qty_shipped);
            const qty_shipped_sales_unit = Number(d.qty_shipped_sales_unit); // revenue calc
            const unit_price = Number(d.unit_price); // revenue calc
            
            // check missing for each field above
            const missing = [];
            if (dateStr == null || String(dateStr).trim() === "") missing.push("order_date");
            if (customer == null || String(customer).trim()=== "") missing.push("customer");
            if (item_id == null || String(item_id).trim()=== "") missing.push("item_id");
            if (!Number.isFinite(qty)) missing.push("qty");
            if (!Number.isFinite(qty_shipped_sales_unit)) missing.push("qty_shipped_sales_unit");
            if (!Number.isFinite(unit_price)) missing.push("unit_price");

            if (missing.length) {
                errors.push({row: currentIndex + 1, missing, raw: d});
            };

            // parse date string
            const dateParts = String(dateStr).split('/');
            let month = Number(dateParts[0]);
            let day   = Number(dateParts[1]);
            let year  = Number(dateParts[2]);
            if (year < 100 && Number.isFinite(year)) year += 2000;
            const order_date = new Date(year, month - 1, day);
            
            // calculate revenue
            const revenue = qty_shipped_sales_unit * unit_price;

            return {
                order_date,
                customer,
                item_id,
                qty,
                revenue,
            };
        })
        // IMPORTANT: drop invalid rows so the chart never sees NaN
        .filter(d =>
            d.order_date instanceof Date &&
            Number.isFinite(d.order_date.getTime()) &&
            Number.isFinite(d.revenue) &&
            d.item_id != null
        )
        .sort((a, b) => a.order_date - b.order_date);

        if (errors.length) {
            optional: console.log("Errors", errors)
            console.log("data row count: ", salesData.length)
            console.log('first row: ', salesData[0])
        };
        
        uniqueItems = [...new Set(salesData.map(d => d.item_id))].sort(); // Get unique item IDs
        updateSearchResults(); // Update the list with all items initially
        render()

        // ✅ Save to IndexedDB
        const salesDataToStore = salesData.map(d => ({
            order_date_ms: d.order_date.getTime(),
            customer: d.customer,
            item_id: d.item_id,
            qty: d.qty,
            revenue: d.revenue
        }));

        await putRecord({
            id: "salesData",
            data: salesDataToStore
        });

    };
    reader.readAsText(file);
};

//// indexeddb functions

const DB_NAME = "myApp";
const DB_VERSION = 1;
const STORE_NAME = "data";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (event) => {
      const db = event.target.result;

      if (!db.objectStoreNames.contains(STORE_NAME)) {
        // keyPath "id" so we can upsert by id
        db.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function putRecord(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getRecord(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).get(id);
    req.onsuccess = () => resolve(req.result ?? null);
    req.onerror = () => reject(req.error);
  });
}

async function loadFromIndexedDB() {
  const record = await getRecord("salesData");
  if (!record) return;

  // Rebuild Date objects
  salesData = record.data.map(d => ({
    order_date: new Date(d.order_date_ms),
    customer: d.customer,
    item_id: d.item_id,
    qty: d.qty,
    revenue: d.revenue
  })).sort((a, b) => a.order_date - b.order_date);

  uniqueItems = [...new Set(salesData.map(d => d.item_id))].sort();
  updateSearchResults();
  render();
}



/// chart functions

function getSelectedItems() {
    return d3.select("#selectedItems").selectAll("li").nodes().map(li => li.dataset.item);
};

function addItemToList(item) {
    const selectedItemsList = d3.select("#selectedItems");
    if (!selectedItemsList.selectAll(`li[data-item="${item}"]`).size()) {
        const listItem = selectedItemsList.append("li").attr("data-item", item);
        
        listItem.append("span")
            .attr("class", "remove-button")

            .on("click", function () {

                render()
            });
    
        listItem.append("span")
            .text(item);
        setTheme();
        render();
    };
};

function addItemsToList(items) {
    const selectedItemsList = d3.select("#selectedItems");
    items.forEach((item)=>{
        if (!selectedItemsList.selectAll(`li[data-item="${item}"]`).size()) {
            const listItem = selectedItemsList.append("li").attr("data-item", item);
            
            listItem.append("span")
                .attr("class", "remove-button")
                .text("✖  ")
                .on("click", function () {
                    d3.select(this.parentNode).remove(); // Remove the item from the list
                    render()
                });

            listItem.append("span")
                .text(item);
        }
    });
    setTheme();
    render();
};

function getCustomerList(){
    return d3.select("#selectedCustomers").selectAll("li").nodes().map(li => li.dataset.customer);
};

function addCustomerToList(customer){
    const selectedCustomersList = d3.select("#selectedCustomers");
    if(!selectedCustomersList.selectAll(`li[data-customer="${customer}"]`).size()){
        const listItem = selectedCustomersList.append("li").attr("data-customer", customer);

        listItem.append("span")

function render() {
    let customers = getCustomerList();
    console.log(customers);
    let data = [];
    if (customers.length){
        data = salesData.filter(d => customers.includes(d.customer));
    } else {

    };

    if (selectedItems.length) {
        renderChart(data, selectedItems);
    } else {
        renderTotalChart(data);
    };
    renderItemStats(data, selectedItems);
    renderCustomerStats(data, selectedItems);
};

function renderChart(data, selectedItems) {
    const filteredData = data.filter(d => selectedItems.includes(d.item_id));

    // Aggregating data by month
    const aggregatedData = d3.rollup(filteredData,
        v => d3.sum(v, d => d.qty),
        d => d3.timeMonth(d.order_date),
        d => d.item_id // Group by item ID as well
    );
    // console.log('aggregatedData',aggregatedData);

    // const monthlySales = Array.from(aggregatedData, ([date, itemData]) => {
    //     return Array.from(itemData, ([itemId, qty]) => ({ date, itemId, qty }));
    // }).flat();

    // 1) all items that appear anywhere in your data
    const allItemIds = new Set(filteredData.map(d => d.item_id));

    // 2) month range to cover (from min to max order_date)
    const monthStart = d3.timeMonth.floor(d3.min(filteredData, d => d.order_date));
    const monthEnd   = d3.timeMonth.floor(d3.max(filteredData, d => d.order_date));

    // If you want a fixed range instead, replace with your own start/end.
    const months = d3.timeMonth.range(monthStart, d3.timeMonth.offset(monthEnd, 1));

    // 3) build full grid: every month x every itemId, qty=0 if missing
    const monthlySales = months.flatMap(date => {
        const itemMap = aggregatedData.get(date); // Map<itemId, qty> or undefined
        return Array.from(allItemIds, itemId => ({
            date,
            itemId,
            qty: itemMap?.get(itemId) ?? 0
        }));
    });
    // console.log('monthlySales', monthlySales);

    const x = d3.scaleTime()
        .domain(d3.extent(monthlySales, d => d.date))
        .range([0, width]);

    const y = d3.scaleLinear()
        .domain([0, d3.max(monthlySales, d => d.qty)]).nice()
        .range([height, 0]);

    svg.selectAll("*").remove(); // Clear previous chart

    // X Axis
    svg.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(x));

    // Y Axis
    svg.append("g")
        // .attr("transform", `translate(20,0)`)
        .attr("class", "axis")
        .call(d3.axisLeft(y));

    // Line generator
    const line = d3.line()
        .x(d => x(d.date))
        .y(d => y(d.qty));

    // Draw lines for each selected item
    const items = Array.from(new Set(monthlySales.map(d => d.itemId)));
    items.forEach(itemId => {
        const itemData = monthlySales.filter(d => d.itemId === itemId);
        const sanitizedId = sanitizeId(itemId); // Add this line

        // Draw the line
        svg.append("path")
            .datum(itemData)
            .attr("fill", "none")
            .attr("stroke", themeColors[items.indexOf(itemId) % 10]) // Cycle through colors
            .attr("stroke-width", 1.5)
            .attr("d", line);

        // Add hover effect for data points
        svg.selectAll(".dot-" + sanitizedId)
            .data(itemData)
            .enter().append("circle")
            .attr("class", "dot dot-" + sanitizedId) // Unique class for each item
            .attr("cx", d => x(d.date))
            .attr("cy", d => y(d.qty))
            .attr("r", 4) // Circle radius
            .attr("fill", themeColors[items.indexOf(itemId) % 10])
            .on("mouseover", function (event, d) {
                // this function runs everytime on hover
                // Format date as MM-YYYY
                const formattedDate = new Date(d.date).toLocaleDateString('en-US', { 
                    month: '2-digit', 
                    year: 'numeric' 
                });
                
                tooltip
                    .style("opacity", 1)
                    .html("Item: " + itemId + "<br>Qty: " + d.qty + "<br>Date: " + formattedDate)
                    .style("left", (event.pageX + 5) + "px")
                    .style("top", (event.pageY - 28) + "px");
            })
            .on("mouseout", function () {
                tooltip.style("opacity", 0);
            });
    });

    // Add Legend
    const legendX = width-840;
    const legendY = 0;
    
    const legend = svg.append("g")
        .attr("class", "legend")
        .attr("transform", `translate(${legendX}, ${legendY})`);

    items.forEach((itemId, index) => {
        const legendItem = legend.append("g")
            .attr("class", "legend-item")
            .attr("transform", `translate(0, ${index * 20})`);

        // Color box
        legendItem.append("rect")
            .attr("class", "legend-color")
            .attr("fill", themeColors[index % 10]);

        // Item label
        legendItem.append("text")
            .attr("x", 20)
            .attr("y", 12)
            .text(itemId);
    });
    svg.append("text")
    .attr("x", width / 2)
    .attr("y", 0)
    .attr("text-anchor", "middle")
    .style("font-size", "14px")
    .style("font-weight", "bold")
    .text("Quantity shipped");
}

function renderTotalChart(data) {
    // console.log(data.slice(0, 10));

    // Aggregate total revenue by month
    const monthlyRevenue = Array.from(
    d3.rollup(
        data,
        rows => d3.sum(rows, d => d.revenue ?? 0),
        d => d3.timeMonth(d.order_date)
    ),
    ([date, revenue]) => ({ date, revenue })
    ).sort((a, b) => a.date - b.date);

    // console.log("monthlyRevenue", monthlyRevenue);

    // Create scales
    const x = d3.scaleTime()
        .domain(d3.extent(monthlyRevenue, d => d.date))
        .range([0, width]);

    const y = d3.scaleLinear()
        .domain([0, d3.max(monthlyRevenue, d => d.revenue)])
        .nice()
        .range([height, 0]);

    // Clear previous chart
    svg.selectAll("*").remove();

    // X Axis
    svg.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(x));

    // Y Axis
    svg.append("g")
        .attr("class", "axis")
        // .attr("transform", `translate(20,0)`)
        .call(
            d3.axisLeft(y)
                .tickFormat(d => d3.formatPrefix(".1", 1e6)(d))
                // .tickFormat(d3.formatPrefix(".2", 1e6))  // e.g., 3.75M
                // .tickFormat(d3.format("$,.0f"))

        );

    // Line generator
    const line = d3.line()
        .x(d => x(d.date))
        .y(d => y(d.revenue));

    // Revenue line
    svg.append("path")
        .datum(monthlyRevenue)
        .attr("fill", "none")
        .attr("stroke", revLineColor)
        .attr("stroke-width", 3)
        .attr("d", line);

    // Revenue points
    svg.selectAll(".revenue-dot")
        .data(monthlyRevenue)
        .enter()
        .append("circle")
        .attr("class", "revenue-dot")
        .attr("cx", d => x(d.date))
        .attr("cy", d => y(d.revenue))
        .attr("r", 4)
        .attr("fill", revLineColor)
        .on("mouseover", function (event, d) {

            const formattedDate = d.date.toLocaleDateString("en-US", {
                month: "2-digit",
                year: "numeric"
            });

            tooltip
                .style("opacity", 1)
                .html(`
                    Revenue: ${d3.format("$,.2f")(d.revenue)}<br>
                    Date: ${formattedDate}
                `)
                .style("left", (event.pageX + 5) + "px")
                .style("top", (event.pageY - 28) + "px");

        })
        .on("mouseout", function () {
            tooltip.style("opacity", 0);
        });

    // Optional chart title
    svg.append("text")
        .attr("x", width / 2)
        .attr("y", 0)
        .attr("text-anchor", "middle")
        .style("font-size", "14px")
        .style("font-weight", "bold")
        .text("Monthly Revenue by order date ($)");
};

function renderCustomerStats(data, selectedItems){
    let rows = [];
    if (selectedItems.length){
        const selectedSet = new Set(selectedItems);
        rows = Array.from(
            d3.rollup(
                data.filter(d => selectedSet.has(d.item_id)),
                rows => d3.sum(rows, d => d.qty),
                d => d.customer
            ),
            ([customer, qty]) => ({customer, qty})
        ).sort((a,b) => b.qty - a.qty);
        // console.log(rows)
    } else {
        rows = Array.from(
            d3.rollup(
                data,
                rows => d3.sum(rows, d => d.revenue),
                d => d.customer
            ),
            ([customer, revenue]) => ({customer, revenue})
        ).sort((a,b) => b.revenue - a.revenue);
    };

    rows = rows.slice(0, 100);
    const container = d3.select("#customers");
    container.selectAll("*").remove();

    const headers = rows[0].qty !== undefined ? ["customer", "qty"] : ["customer", "revenue"];
    const table = container.append("table");
    table.append("thead")
        .append("tr")
        .selectAll("th")
        .data(headers)
        .enter()
        .append("th")
        .attr("class", "table-headers")
        .text(d => d);

    // const fmt2 = d3.format(",.2f");
    // const moneyHeaders = new Set(["revenue"]); // adjust to your real header keys
    const fmt2 = d3.format(",.0f");
    const moneyHeaders = new Set(["revenue", "qty"]); // adjust to your real header keys

    table.append("tbody")
        .selectAll("tr")
        .data(rows)
        .enter()
        .append("tr")
        .on("click", (event, row)=>{
            addCustomerToList(row.customer)
            // renderCustomerChart(row.customer)
        })
        .selectAll("td")
        .data(d => headers.map(h => d[h]))
        .enter()
        .append("td")
        .attr("class", (d, i) => {
            const h = headers[i];
            return moneyHeaders.has(h) ? "number-cell" : "text-cell";
        })
        // .text(d => d);
        .text((d, i)=> {
            const h = headers[i];
            return moneyHeaders.has(h) ? `${fmt2(Number(d))}`: String(d);
        });
};
